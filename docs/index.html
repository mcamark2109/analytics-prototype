<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HOOPS FOR HOPE | Jersey Drop Analytics</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@700&family=Roboto:wght@400;700&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        :root {
            --deep-charcoal: #121212;
            --neon-orange: #FF5F1F;
            --slate-grey: #2A2A2A;
            --off-white: #E0E0E0;
            --pure-white: #FFFFFF;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: var(--deep-charcoal);
            color: var(--off-white);
            font-family: 'Roboto', sans-serif;
            line-height: 1.6;
            overflow-x: hidden;
        }

        h1, h2, h3 {
            font-family: 'Inter', sans-serif;
            text-transform: uppercase;
            color: var(--pure-white);
            letter-spacing: 1px;
        }

        /* Background Video */
        .video-bg {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: -2;
            object-fit: cover;
            filter: grayscale(50%) brightness(40%);
        }

        .video-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: -1;
            background: linear-gradient(rgba(18,18,18,0.8), rgba(18,18,18,0.8));
        }

        /* Header */
        header {
            padding: 4rem 2rem;
            text-align: center;
            max-width: 1200px;
            margin: 0 auto;
        }

        header h1 {
            font-size: 3rem;
            margin-bottom: 1rem;
            text-shadow: 0 0 20px rgba(255, 95, 31, 0.4);
        }

        .critical-notice {
            background-color: rgba(255, 95, 31, 0.15);
            border: 1px solid var(--neon-orange);
            color: var(--pure-white);
            padding: 1rem 2rem;
            border-radius: 8px;
            display: inline-block;
            font-weight: bold;
            font-size: 0.9rem;
            text-transform: uppercase;
            backdrop-filter: blur(5px);
        }

        /* Main Layout */
        main {
            max-width: 1200px;
            margin: 0 auto;
            padding: 2rem;
        }

        /* Chart Grid */
        .chart-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 2rem;
            margin-bottom: 4rem;
        }

        .chart-card {
            background-color: var(--slate-grey);
            border-radius: 8px;
            padding: 1.5rem;
            border-bottom: 3px solid var(--neon-orange);
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            transition: transform 0.3s ease;
        }

        .chart-card:hover {
            transform: translateY(-5px);
        }

        .chart-card h2 {
            font-size: 1.2rem;
            margin-bottom: 1.5rem;
            text-align: center;
        }

        .full-width {
            grid-column: span 2;
        }

        /* Data Table */
        .table-container {
            background-color: var(--slate-grey);
            border-radius: 8px;
            padding: 2rem;
            border-bottom: 3px solid var(--neon-orange);
            overflow-x: auto;
        }

        .table-container h2 {
            margin-bottom: 1.5rem;
            text-align: center;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            text-align: left;
            font-size: 1rem;
        }

        th {
            color: var(--pure-white);
            border-bottom: 2px solid var(--neon-orange);
            padding: 1rem;
            text-transform: uppercase;
            font-size: 0.85rem;
        }

        td {
            padding: 1rem;
            border-bottom: 1px solid rgba(255,255,255,0.1);
        }

        tr:hover td {
            background-color: rgba(255,255,255,0.05);
        }

        /* Responsive */
        @media (max-width: 768px) {
            .chart-grid {
                grid-template-columns: 1fr;
            }
            .full-width {
                grid-column: span 1;
            }
            header h1 {
                font-size: 2rem;
            }
        }
    </style>
</head>
<body>
    <video class="video-bg" autoplay muted loop playsinline>
        <source src="https://assets.mixkit.co/videos/preview/mixkit-basketball-player-dribbling-the-ball-in-the-court-41465-large.mp4" type="video/mp4">
        Your browser does not support the video tag.
    </video>
    <div class="video-overlay"></div>

    <header>
        <h1>Hoops for Hope: Jersey Drop Analytics</h1>
        <div class="critical-notice">
            PROTOTYPE: This dashboard contains SIMULATED/PROJECTED data for strategic planning purposes.
        </div>
    </header>

    <main>
        <div class="chart-grid">
            <div class="chart-card">
                <h2>Projected Visitors</h2>
                <canvas id="visitorsChart"></canvas>
            </div>
            <div class="chart-card">
                <h2>Projected Conversions</h2>
                <canvas id="conversionsChart"></canvas>
            </div>
            <div class="chart-card full-width">
                <h2>Projected Churn Rate (%)</h2>
                <canvas id="churnChart"></canvas>
            </div>
        </div>

        <div class="table-container">
            <h2>Projected Performance Data</h2>
            <table>
                <thead>
                    <tr>
                        <th>Month</th>
                        <th>Visitors</th>
                        <th>Conversions</th>
                        <th>Conv. Rate</th>
                        <th>Churn Rate</th>
                    </tr>
                </thead>
                <tbody id="dataTableBody">
                    <!-- Data injected by JS -->
                </tbody>
            </table>
        </div>
    </main>

    <script>
        const projectedData = [
            { month: 'Month 1', visitors: 1658, conversions: 36, convRate: '2.2%', churnRate: 6.5 },
            { month: 'Month 2', visitors: 1791, conversions: 43, convRate: '2.4%', churnRate: 6.5 },
            { month: 'Month 3', visitors: 1934, conversions: 46, convRate: '2.4%', churnRate: 6.5 },
            { month: 'Month 4', visitors: 2089, conversions: 46, convRate: '2.2%', churnRate: 6.5 },
            { month: 'Month 5', visitors: 2256, conversions: 56, convRate: '2.5%', churnRate: 6.5 },
            { month: 'Month 6', visitors: 2436, conversions: 63, convRate: '2.6%', churnRate: 6.5 },
        ];

        const labels = projectedData.map(d => d.month);
        const visitors = projectedData.map(d => d.visitors);
        const conversions = projectedData.map(d => d.conversions);
        const churns = projectedData.map(d => d.churnRate);

        // Global Chart Defaults
        Chart.defaults.color = '#E0E0E0';
        Chart.defaults.font.family = 'Roboto';
        Chart.defaults.borderColor = 'rgba(224, 224, 224, 0.1)';

        // Visitors Chart
        new Chart(document.getElementById('visitorsChart'), {
            type: 'line',
            data: {
                labels: labels,
                datasets: [{
                    label: 'Visitors',
                    data: visitors,
                    borderColor: '#FF5F1F',
                    backgroundColor: 'rgba(255, 95, 31, 0.1)',
                    fill: true,
                    tension: 0.4,
                    borderWidth: 3,
                    pointBackgroundColor: '#FFFFFF'
                }]
            },
            options: {
                responsive: true,
                plugins: { legend: { display: false } },
                scales: {
                    y: { beginAtZero: false },
                    x: { grid: { display: false } }
                }
            }
        });

        // Conversions Chart
        new Chart(document.getElementById('conversionsChart'), {
            type: 'bar',
            data: {
                labels: labels,
                datasets: [{
                    label: 'Conversions',
                    data: conversions,
                    backgroundColor: 'rgba(255, 95, 31, 0.7)',
                    borderColor: '#FF5F1F',
                    borderWidth: 1,
                    borderRadius: 4
                }]
            },
            options: {
                responsive: true,
                plugins: { legend: { display: false } },
                scales: {
                    y: { beginAtZero: true },
                    x: { grid: { display: false } }
                }
            }
        });

        // Churn Chart
        new Chart(document.getElementById('churnChart'), {
            type: 'line',
            data: {
                labels: labels,
                datasets: [{
                    label: 'Churn Rate %',
                    data: churns,
                    borderColor: '#FF5F1F',
                    borderDash: [5, 5],
                    borderWidth: 2,
                    pointBackgroundColor: '#FFFFFF',
                    tension: 0,
                    fill: false
                }]
            },
            options: {
                responsive: true,
                maintainAspectRatio: false,
                plugins: { legend: { display: false } },
                scales: {
                    y: { 
                        beginAtZero: false,
                        suggestedMin: 6,
                        suggestedMax: 7 
                    },
                    x: { grid: { display: false } }
                }
            }
        });

        // Table Data Injection
        const tbody = document.getElementById('dataTableBody');
        projectedData.forEach(row => {
            const tr = document.createElement('tr');
            tr.innerHTML = `
                <td>${row.month}</td>
                <td>${row.visitors.toLocaleString()}</td>
                <td>${row.conversions}</td>
                <td>${row.convRate}</td>
                <td>${row.churnRate}%</td>
            `;
            tbody.appendChild(tr);
        });
    </script>
</body>
</html>
