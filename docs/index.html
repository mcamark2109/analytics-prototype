<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AuroraFit Performance Dashboard</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        :root {
            --bg-primary: #121212;
            --bg-surface: #1E1E1E;
            --accent-primary: #14B8A6;
            --accent-secondary: #FB7185;
            --text-primary: #F8FAFC;
            --text-secondary: #94A3B8;
            --border-color: #334155;
        }

        body {
            background-color: var(--bg-primary);
            color: var(--text-primary);
            font-family: 'Inter', 'Segoe UI', system-ui, -apple-system, sans-serif;
            margin: 0;
            padding: 0;
            line-height: 1.6;
        }

        header {
            text-align: center;
            padding: 3rem 1rem;
            background: linear-gradient(180deg, #1a1a1a 0%, var(--bg-primary) 100%);
        }

        h1 {
            font-weight: 700;
            font-size: 2.5rem;
            margin: 0;
            letter-spacing: -0.025em;
            color: var(--text-primary);
        }

        .disclaimer {
            display: inline-block;
            margin-top: 1rem;
            padding: 0.5rem 1rem;
            background-color: rgba(20, 184, 166, 0.1);
            border: 1px solid var(--accent-primary);
            color: var(--accent-primary);
            font-size: 0.9rem;
            font-weight: 500;
            border-radius: 8px;
        }

        main {
            max-width: 1200px;
            margin: 0 auto;
            padding: 2rem;
        }

        .viz-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 2rem;
            margin-bottom: 3rem;
        }

        .card {
            background-color: var(--bg-surface);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 1.5rem;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06);
        }

        .card h2 {
            font-size: 1.25rem;
            margin-bottom: 1.5rem;
            color: var(--text-secondary);
            font-weight: 600;
            text-align: center;
        }

        .table-container {
            overflow-x: auto;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 1rem;
            color: var(--text-secondary);
        }

        th, td {
            padding: 1rem;
            text-align: left;
            border-bottom: 1px solid var(--border-color);
        }

        th {
            color: var(--text-primary);
            font-weight: 600;
            background-color: rgba(255, 255, 255, 0.02);
        }

        tr:hover {
            background-color: rgba(255, 255, 255, 0.01);
        }

        @media (max-width: 768px) {
            .viz-grid {
                grid-template-columns: 1fr;
            }
            h1 {
                font-size: 1.75rem;
            }
        }
    </style>
</head>
<body>
    <header>
        <h1>AuroraFit Performance Dashboard</h1>
        <div class="disclaimer">
            PROTOTYPE: This dashboard displays SIMULATED/PROJECTED estimates for planning purposes.
        </div>
    </header>

    <main>
        <div class="viz-grid">
            <div class="card">
                <h2>Monthly Visitors</h2>
                <canvas id="visitorsChart" aria-label="Line chart showing growth of monthly visitors"></canvas>
            </div>
            <div class="card">
                <h2>Total Conversions</h2>
                <canvas id="conversionsChart" aria-label="Bar chart showing growth of monthly conversions"></canvas>
            </div>
            <div class="card" style="grid-column: span 2;">
                <h2>Churn Rate Trend (%)</h2>
                <canvas id="churnChart" aria-label="Line chart showing decline of churn rate" style="max-height: 300px;"></canvas>
            </div>
        </div>

        <div class="card">
            <h2>Projected Data Summary</h2>
            <div class="table-container">
                <table>
                    <thead>
                        <tr>
                            <th>Month</th>
                            <th>Visitors</th>
                            <th>Conversions</th>
                            <th>Conv. Rate (%)</th>
                            <th>Churn Rate (%)</th>
                        </tr>
                    </thead>
                    <tbody id="dataTable">
                        <!-- Data inserted by JS -->
                    </tbody>
                </table>
            </div>
        </div>
    </main>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const data = [
                { month: 'Month 1', visitors: 1567, conversions: 34, convRate: 2.2, churnRate: 6.5 },
                { month: 'Month 2', visitors: 1739, conversions: 43, convRate: 2.5, churnRate: 6.2 },
                { month: 'Month 3', visitors: 1896, conversions: 51, convRate: 2.7, churnRate: 6.1 },
                { month: 'Month 4', visitors: 2124, conversions: 59, convRate: 2.8, churnRate: 5.7 },
                { month: 'Month 5', visitors: 2336, conversions: 65, convRate: 2.8, churnRate: 5.5 },
                { month: 'Month 6', visitors: 2523, conversions: 68, convRate: 2.7, churnRate: 5.5 },
            ];

            const labels = data.map(d => d.month);

            // Data Table
            const tbody = document.getElementById('dataTable');
            data.forEach(d => {
                const row = `<tr>
                    <td>${d.month}</td>
                    <td>${d.visitors.toLocaleString()}</td>
                    <td>${d.conversions}</td>
                    <td>${d.convRate}%</td>
                    <td>${d.churnRate}%</td>
                </tr>`;
                tbody.innerHTML += row;
            });

            // Visitors Chart
            new Chart(document.getElementById('visitorsChart'), {
                type: 'line',
                data: {
                    labels: labels,
                    datasets: [{
                        label: 'Visitors',
                        data: data.map(d => d.visitors),
                        borderColor: '#14B8A6',
                        backgroundColor: 'rgba(20, 184, 166, 0.2)',
                        fill: true,
                        tension: 0.4
                    }]
                },
                options: {
                    responsive: true,
                    plugins: { legend: { labels: { color: '#94A3B8' } } },
                    scales: {
                        y: { grid: { color: '#334155' }, ticks: { color: '#94A3B8' } },
                        x: { grid: { color: '#334155' }, ticks: { color: '#94A3B8' } }
                    }
                }
            });

            // Conversions Chart
            new Chart(document.getElementById('conversionsChart'), {
                type: 'bar',
                data: {
                    labels: labels,
                    datasets: [{
                        label: 'Conversions',
                        data: data.map(d => d.conversions),
                        backgroundColor: '#FB7185',
                        borderRadius: 5
                    }]
                },
                options: {
                    responsive: true,
                    plugins: { legend: { labels: { color: '#94A3B8' } } },
                    scales: {
                        y: { grid: { color: '#334155' }, ticks: { color: '#94A3B8' } },
                        x: { grid: { color: '#334155' }, ticks: { color: '#94A3B8' } }
                    }
                }
            });

            // Churn Chart
            new Chart(document.getElementById('churnChart'), {
                type: 'line',
                data: {
                    labels: labels,
                    datasets: [{
                        label: 'Churn Rate (%)',
                        data: data.map(d => d.churnRate),
                        borderColor: '#14B8A6',
                        borderDash: [5, 5],
                        tension: 0.4
                    }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    plugins: { legend: { labels: { color: '#94A3B8' } } },
                    scales: {
                        y: { grid: { color: '#334155' }, ticks: { color: '#94A3B8' } },
                        x: { grid: { color: '#334155' }, ticks: { color: '#94A3B8' } }
                    }
                }
            });
        });
    </script>
</body>
</html>
