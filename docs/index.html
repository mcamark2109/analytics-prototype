<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PLAY YOUR WAY // PROJECTED GROWTH</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@700&family=Roboto+Mono&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        :root {
            --electric-lime: #CCFF00;
            --charcoal-grey: #1A1A1A;
            --optic-white: #FFFFFF;
            --slate-grey: #2D2D2D;
            --warning-red: #FF4B4B;
        }

        body {
            background-color: var(--charcoal-grey);
            color: var(--optic-white);
            font-family: 'Roboto Mono', monospace;
            margin: 0;
            padding: 0;
            line-height: 1.4;
        }

        header {
            background-color: var(--electric-lime);
            color: var(--charcoal-grey);
            padding: 2rem 1rem;
            text-align: left;
            border-bottom: 8px solid var(--optic-white);
        }

        h1 {
            font-family: 'Inter', sans-serif;
            font-weight: 700;
            font-size: 3rem;
            text-transform: uppercase;
            margin: 0;
            letter-spacing: -2px;
        }

        .banner {
            background-color: var(--charcoal-grey);
            color: var(--electric-lime);
            display: inline-block;
            padding: 0.5rem 1rem;
            font-weight: bold;
            margin-top: 1rem;
            text-transform: uppercase;
            font-size: 0.9rem;
        }

        .dashboard-container {
            padding: 2rem;
            display: grid;
            grid-template-columns: repeat(6, 1fr);
            gap: 2rem;
            max-width: 1400px;
            margin: 0 auto;
        }

        .card {
            background-color: var(--slate-grey);
            padding: 1.5rem;
            border-left: 4px solid var(--electric-lime);
        }

        .card h2 {
            font-family: 'Inter', sans-serif;
            font-size: 1.2rem;
            text-transform: uppercase;
            margin-top: 0;
            margin-bottom: 1.5rem;
            letter-spacing: 1px;
        }

        /* Asymmetrical Grid Layout */
        .chart-traffic {
            grid-column: span 4;
            height: 400px;
        }

        .chart-conversion {
            grid-column: span 2;
            height: 400px;
        }

        .chart-retention {
            grid-column: span 3;
            height: 400px;
        }

        .table-container {
            grid-column: span 3;
            overflow-x: auto;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            text-align: left;
            font-size: 0.9rem;
        }

        th {
            color: var(--electric-lime);
            text-transform: uppercase;
            padding: 1rem 0.5rem;
            border-bottom: 2px solid var(--slate-grey);
        }

        td {
            padding: 0.75rem 0.5rem;
            border-bottom: 1px solid #3d3d3d;
        }

        tr:hover {
            background-color: #333;
        }

        canvas {
            width: 100% !important;
            height: 100% !important;
        }

        @media (max-width: 1024px) {
            .chart-traffic, .chart-conversion, .chart-retention, .table-container {
                grid-column: span 6;
            }
        }
    </style>
</head>
<body>

    <header>
        <h1>PLAY YOUR WAY // PROJECTED GROWTH</h1>
        <div class="banner">SIMULATED DATA: This dashboard displays projected estimates for planning purposes.</div>
    </header>

    <div class="dashboard-container">
        <div class="card chart-traffic">
            <h2>Traffic Velocity (Visitors)</h2>
            <div style="position: relative; height: 300px;">
                <canvas id="trafficChart"></canvas>
            </div>
        </div>

        <div class="card chart-conversion">
            <h2>Conversion Volume</h2>
            <div style="position: relative; height: 300px;">
                <canvas id="conversionChart"></canvas>
            </div>
        </div>

        <div class="card chart-retention">
            <h2>Retention Health (Churn Rate)</h2>
            <div style="position: relative; height: 300px;">
                <canvas id="retentionChart"></canvas>
            </div>
        </div>

        <div class="table-container">
            <table id="dataTable">
                <thead>
                    <tr>
                        <th>Month</th>
                        <th>Visitors</th>
                        <th>Conversions</th>
                        <th>Conv. Rate</th>
                        <th>Churn Rate</th>
                    </tr>
                </thead>
                <tbody>
                    <!-- Data injected via JS -->
                </tbody>
            </table>
        </div>
    </div>

    <script>
        const projectedData = [
            { month: 'Month 1', visitors: 1484, conversions: 33, convRate: 2.2, churn: 6.5 },
            { month: 'Month 2', visitors: 1632, conversions: 39, convRate: 2.4, churn: 6.3 },
            { month: 'Month 3', visitors: 1828, conversions: 44, convRate: 2.4, churn: 5.9 },
            { month: 'Month 4', visitors: 1993, conversions: 44, convRate: 2.2, churn: 5.8 },
            { month: 'Month 5', visitors: 2212, conversions: 55, convRate: 2.5, churn: 5.5 },
            { month: 'Month 6', visitors: 2389, conversions: 62, convRate: 2.6, churn: 5.5 },
        ];

        const labels = projectedData.map(d => d.month);
        const chartDefaults = {
            responsive: true,
            maintainAspectRatio: false,
            plugins: {
                legend: {
                    labels: {
                        color: '#FFFFFF',
                        font: {
                            family: 'Roboto Mono'
                        }
                    }
                }
            },
            scales: {
                x: {
                    grid: { color: '#333333' },
                    ticks: { color: '#FFFFFF', font: { family: 'Roboto Mono' } }
                },
                y: {
                    grid: { color: '#333333' },
                    ticks: { color: '#FFFFFF', font: { family: 'Roboto Mono' } }
                }
            }
        };

        // Traffic Velocity
        new Chart(document.getElementById('trafficChart'), {
            type: 'line',
            data: {
                labels: labels,
                datasets: [{
                    label: 'Visitors',
                    data: projectedData.map(d => d.visitors),
                    borderColor: '#CCFF00',
                    backgroundColor: '#CCFF00',
                    tension: 0.3,
                    fill: false
                }]
            },
            options: chartDefaults
        });

        // Conversion Volume
        new Chart(document.getElementById('conversionChart'), {
            type: 'bar',
            data: {
                labels: labels,
                datasets: [{
                    label: 'Conversions',
                    data: projectedData.map(d => d.conversions),
                    backgroundColor: '#FFFFFF'
                }]
            },
            options: chartDefaults
        });

        // Retention Health
        new Chart(document.getElementById('retentionChart'), {
            type: 'line',
            data: {
                labels: labels,
                datasets: [{
                    label: 'Churn Rate (%)',
                    data: projectedData.map(d => d.churn),
                    borderColor: '#FF4B4B',
                    backgroundColor: '#FF4B4B',
                    tension: 0.3,
                    fill: false
                }]
            },
            options: chartDefaults
        });

        // Table Population
        const tbody = document.querySelector('#dataTable tbody');
        projectedData.forEach(d => {
            const row = `<tr>
                <td>${d.month}</td>
                <td>${d.visitors.toLocaleString()}</td>
                <td>${d.conversions}</td>
                <td>${d.convRate}%</td>
                <td>${d.churn}%</td>
            </tr>`;
            tbody.innerHTML += row;
        });
    </script>
</body>
</html>
