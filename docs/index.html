<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AuroraFit Launch Analytics</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        :root {
            --bg-color: #121212;
            --surface-color: #1E1E1E;
            --primary-accent: #14B8A6;
            --secondary-accent: #FB7185;
            --text-primary: #F8FAFC;
            --text-secondary: #94A3B8;
            --border-color: #333;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-primary);
            font-family: 'Inter', 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            padding: 0;
            line-height: 1.6;
        }

        .container {
            max-width: 1100px;
            margin: 0 auto;
            padding: 2rem;
        }

        header {
            text-align: center;
            margin-bottom: 3rem;
        }

        h1 {
            font-weight: 600;
            font-size: 2.5rem;
            margin-bottom: 1rem;
            letter-spacing: -0.025em;
        }

        .banner {
            background-color: rgba(20, 184, 166, 0.1);
            border: 1px solid var(--primary-accent);
            color: var(--primary-accent);
            padding: 0.75rem 1.5rem;
            border-radius: 8px;
            display: inline-block;
            font-size: 0.9rem;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }

        .visualizations-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 2rem;
            margin-bottom: 3rem;
        }

        .card {
            background-color: var(--surface-color);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 1.5rem;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.3);
        }

        .card h3 {
            margin-top: 0;
            margin-bottom: 1.5rem;
            font-weight: 600;
            color: var(--text-primary);
            text-align: center;
        }

        .table-container {
            overflow-x: auto;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 1rem;
            color: var(--text-primary);
        }

        th, td {
            text-align: left;
            padding: 1rem;
            border-bottom: 1px solid var(--border-color);
        }

        th {
            color: var(--text-secondary);
            font-weight: 600;
            text-transform: uppercase;
            font-size: 0.8rem;
            letter-spacing: 0.05em;
        }

        td {
            color: var(--text-primary);
        }

        .highlight-teal { color: var(--primary-accent); font-weight: 600; }
        .highlight-coral { color: var(--secondary-accent); font-weight: 600; }

        @media (max-width: 768px) {
            .visualizations-grid {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>AuroraFit Launch Analytics</h1>
            <div class="banner">
                SIMULATED/PROJECTED DATA: This dashboard contains projected estimates for planning purposes and does not reflect real-time measured data.
            </div>
        </header>

        <div class="visualizations-grid">
            <div class="card">
                <h3>Visitors Over Time</h3>
                <canvas id="visitorsChart"></canvas>
            </div>
            <div class="card">
                <h3>Monthly Conversions</h3>
                <canvas id="conversionsChart"></canvas>
            </div>
            <div class="card">
                <h3>Churn Rate %</h3>
                <canvas id="churnChart"></canvas>
            </div>
        </div>

        <div class="card">
            <h3>Projected Performance Data</h3>
            <div class="table-container">
                <table id="dataTable">
                    <thead>
                        <tr>
                            <th>Month</th>
                            <th>Visitors</th>
                            <th>Conversions</th>
                            <th>Conv. Rate</th>
                            <th>Churn Rate</th>
                        </tr>
                    </thead>
                    <tbody>
                        <!-- Data injected via JS -->
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <script>
        const dataSet = [
            { month: 'Month 1', visitors: 1567, conversions: 34, convRate: '2.2%', churnRate: '6.5%' },
            { month: 'Month 2', visitors: 1739, conversions: 43, convRate: '2.5%', churnRate: '6.2%' },
            { month: 'Month 3', visitors: 1896, conversions: 51, convRate: '2.7%', churnRate: '6.1%' },
            { month: 'Month 4', visitors: 2124, conversions: 59, convRate: '2.8%', churnRate: '5.7%' },
            { month: 'Month 5', visitors: 2336, conversions: 65, convRate: '2.8%', churnRate: '5.5%' },
            { month: 'Month 6', visitors: 2523, conversions: 68, convRate: '2.7%', churnRate: '5.5%' },
        ];

        // Populate Table
        const tbody = document.querySelector('#dataTable tbody');
        dataSet.forEach(row => {
            const tr = document.createElement('tr');
            tr.innerHTML = `
                <td>${row.month}</td>
                <td class="highlight-teal">${row.visitors}</td>
                <td class="highlight-teal">${row.conversions}</td>
                <td>${row.convRate}</td>
                <td class="highlight-coral">${row.churnRate}</td>
            `;
            tbody.appendChild(tr);
        });

        // Chart Common Options
        const commonOptions = {
            responsive: true,
            plugins: { legend: { display: false } },
            scales: {
                x: { 
                    grid: { display: false }, 
                    ticks: { color: '#94A3B8' } 
                },
                y: { 
                    ticks: { color: '#94A3B8' },
                    grid: { color: '#333' }
                }
            }
        };

        // Visitors Chart
        new Chart(document.getElementById('visitorsChart'), {
            type: 'line',
            data: {
                labels: dataSet.map(d => d.month),
                datasets: [{
                    label: 'Visitors',
                    data: dataSet.map(d => d.visitors),
                    borderColor: '#14B8A6',
                    backgroundColor: 'rgba(20, 184, 166, 0.2)',
                    fill: true,
                    tension: 0.4,
                    pointRadius: 0
                }]
            },
            options: commonOptions
        });

        // Conversions Chart
        new Chart(document.getElementById('conversionsChart'), {
            type: 'bar',
            data: {
                labels: dataSet.map(d => d.month),
                datasets: [{
                    label: 'Conversions',
                    data: dataSet.map(d => d.conversions),
                    backgroundColor: '#14B8A6',
                    borderRadius: 6
                }]
            },
            options: commonOptions
        });

        // Churn Chart
        new Chart(document.getElementById('churnChart'), {
            type: 'line',
            data: {
                labels: dataSet.map(d => d.month),
                datasets: [{
                    label: 'Churn Rate (%)',
                    data: dataSet.map(d => parseFloat(d.churnRate)),
                    borderColor: '#FB7185',
                    backgroundColor: '#FB7185',
                    tension: 0.1,
                    pointRadius: 5,
                    pointHoverRadius: 7
                }]
            },
            options: commonOptions
        });
    </script>
</body>
</html>
