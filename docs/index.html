<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LeBron Power-Pitch | Performance Projections</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        :root {
            --matte-black: #121212;
            --concrete-grey: #2C2C2C;
            --electric-gold: #FFD700;
            --pure-white: #FFFFFF;
            --muted-silver: #A0A0A0;
        }

        body {
            background-color: var(--matte-black);
            color: var(--pure-white);
            font-family: 'Inter', 'Segoe UI', Roboto, Arial, sans-serif;
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        header {
            width: 100%;
            text-align: center;
            padding: 40px 20px;
            background-color: var(--matte-black);
        }

        h1 {
            font-family: 'Arial Black', sans-serif;
            font-weight: 900;
            text-transform: uppercase;
            letter-spacing: -1px;
            font-size: 2.5rem;
            margin: 0 0 20px 0;
            color: var(--pure-white);
        }

        .disclaimer {
            background-color: var(--electric-gold);
            color: var(--matte-black);
            font-weight: bold;
            padding: 10px 20px;
            display: inline-block;
            border-radius: 4px;
            font-size: 0.9rem;
            text-transform: uppercase;
            box-shadow: 0 0 15px rgba(255, 215, 0, 0.3);
        }

        .container {
            max-width: 1200px;
            width: 90%;
            margin-bottom: 60px;
        }

        .analytics-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 20px;
            margin-bottom: 40px;
        }

        .chart-card {
            background-color: var(--concrete-grey);
            padding: 20px;
            border-radius: 8px;
            border: 1px solid transparent;
            transition: border 0.3s ease;
        }

        .chart-card:hover {
            border: 1px solid var(--electric-gold);
        }

        .chart-card h3 {
            color: var(--pure-white);
            font-size: 1.1rem;
            margin-bottom: 15px;
            text-transform: uppercase;
            font-weight: 600;
            text-align: center;
        }

        .table-container {
            background-color: var(--concrete-grey);
            border-radius: 8px;
            overflow: hidden;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }

        table {
            width: 100%;
            border-collapse: collapse;
            text-align: left;
        }

        thead {
            background-color: var(--matte-black);
            color: var(--electric-gold);
            text-transform: uppercase;
            font-size: 0.85rem;
        }

        th, td {
            padding: 15px 20px;
            border-bottom: 1px solid var(--matte-black);
        }

        th {
            border-bottom: 3px solid var(--electric-gold);
        }

        tbody tr:nth-child(even) {
            background-color: var(--matte-black);
        }

        tbody tr:nth-child(odd) {
            background-color: var(--concrete-grey);
        }

        td {
            color: var(--muted-silver);
            font-size: 0.95rem;
        }

        .text-right {
            text-align: right;
        }

        @media (max-width: 992px) {
            .analytics-grid {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>

    <header>
        <h1>LEBRON POWER-PITCH: PERFORMANCE PROJECTIONS</h1>
        <div class="disclaimer">SIMULATED/PROJECTED DATA FOR PLANNING PURPOSES ONLY</div>
    </header>

    <div class="container">
        <div class="analytics-grid">
            <div class="chart-card">
                <h3>Visitors Over Time</h3>
                <canvas id="visitorsChart"></canvas>
            </div>
            <div class="chart-card">
                <h3>Conversions Over Time</h3>
                <canvas id="conversionsChart"></canvas>
            </div>
            <div class="chart-card">
                <h3>Churn Rate Trend</h3>
                <canvas id="churnChart"></canvas>
            </div>
        </div>

        <div class="table-container">
            <table>
                <thead>
                    <tr>
                        <th>Month</th>
                        <th class="text-right">Visitors</th>
                        <th class="text-right">Conversions</th>
                        <th class="text-right">Conv. Rate</th>
                        <th class="text-right">Churn Rate</th>
                    </tr>
                </thead>
                <tbody id="data-table-body">
                    <!-- Data injected via JS -->
                </tbody>
            </table>
        </div>
    </div>

    <script>
        const projectionData = [
            { month: 'Month 1', visitors: 1601, conversions: 35, convRate: '2.2%', churnRate: '6.5%' },
            { month: 'Month 2', visitors: 1745, conversions: 35, convRate: '2.0%', churnRate: '6.4%' },
            { month: 'Month 3', visitors: 1920, conversions: 36, convRate: '1.9%', churnRate: '6.2%' },
            { month: 'Month 4', visitors: 2131, conversions: 40, convRate: '1.9%', churnRate: '5.9%' },
            { month: 'Month 5', visitors: 2387, conversions: 48, convRate: '2.0%', churnRate: '5.5%' },
            { month: 'Month 6', visitors: 2578, conversions: 57, convRate: '2.2%', churnRate: '5.5%' },
        ];

        // Populate Table
        const tableBody = document.getElementById('data-table-body');
        projectionData.forEach(row => {
            const tr = document.createElement('tr');
            tr.innerHTML = `
                <td>${row.month}</td>
                <td class="text-right">${row.visitors}</td>
                <td class="text-right">${row.conversions}</td>
                <td class="text-right">${row.convRate}</td>
                <td class="text-right">${row.churnRate}</td>
            `;
            tableBody.appendChild(tr);
        });

        // Global Chart Defaults
        Chart.defaults.color = '#A0A0A0';
        Chart.defaults.borderColor = '#2C2C2C';

        // Visitors Chart
        const visitorsCtx = document.getElementById('visitorsChart').getContext('2d');
        const goldGradient = visitorsCtx.createLinearGradient(0, 0, 0, 400);
        goldGradient.addColorStop(0, 'rgba(255, 215, 0, 0.5)');
        goldGradient.addColorStop(1, 'rgba(255, 215, 0, 0)');

        new Chart(visitorsCtx, {
            type: 'line',
            data: {
                labels: projectionData.map(d => d.month),
                datasets: [{
                    label: 'Visitors',
                    data: projectionData.map(d => d.visitors),
                    borderColor: '#FFD700',
                    backgroundColor: goldGradient,
                    fill: true,
                    tension: 0.4,
                    borderWidth: 3
                }]
            },
            options: {
                responsive: true,
                plugins: { legend: { display: false } },
                scales: { y: { beginAtZero: false } }
            }
        });

        // Conversions Chart
        const conversionsCtx = document.getElementById('conversionsChart').getContext('2d');
        new Chart(conversionsCtx, {
            type: 'bar',
            data: {
                labels: projectionData.map(d => d.month),
                datasets: [{
                    label: 'Conversions',
                    data: projectionData.map(d => d.conversions),
                    backgroundColor: '#FFD700',
                    borderRadius: 4
                }]
            },
            options: {
                responsive: true,
                plugins: { legend: { display: false } }
            }
        });

        // Churn Chart
        const churnCtx = document.getElementById('churnChart').getContext('2d');
        new Chart(churnCtx, {
            type: 'line',
            data: {
                labels: projectionData.map(d => d.month),
                datasets: [{
                    label: 'Churn Rate',
                    data: projectionData.map(d => parseFloat(d.churnRate)),
                    borderColor: '#FFFFFF',
                    pointBackgroundColor: '#FFFFFF',
                    pointStyle: 'circle',
                    pointRadius: 5,
                    tension: 0.1,
                    borderWidth: 2
                }]
            },
            options: {
                responsive: true,
                plugins: { legend: { display: false } },
                scales: { 
                    y: { 
                        beginAtZero: false,
                        ticks: { callback: value => value + '%' }
                    } 
                }
            }
        });
    </script>
</body>
</html>
