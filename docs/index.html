<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AuroraFit Performance Dashboard</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        :root {
            --bg-color: #121212;
            --surface-color: #1E1E1E;
            --primary-accent: #14B8A6;
            --secondary-accent: #FB7185;
            --text-primary: #F8FAFC;
            --text-secondary: #94A3B8;
            --border-color: #334155;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-primary);
            font-family: 'Inter', 'Segoe UI', system-ui, -apple-system, sans-serif;
            margin: 0;
            padding: 0;
            line-height: 1.6;
        }

        header {
            padding: 2rem 1rem;
            text-align: center;
            border-bottom: 1px solid var(--border-color);
        }

        h1 {
            font-weight: 700;
            font-size: 2rem;
            margin: 0;
            letter-spacing: -0.025em;
            color: var(--text-primary);
        }

        .disclaimer {
            background-color: rgba(20, 184, 166, 0.1);
            color: var(--primary-accent);
            border: 1px solid var(--primary-accent);
            padding: 0.75rem 1rem;
            margin: 1rem auto;
            max-width: 800px;
            border-radius: 8px;
            font-size: 0.875rem;
            font-weight: 500;
            text-align: center;
        }

        main {
            max-width: 1200px;
            margin: 0 auto;
            padding: 2rem 1rem;
        }

        .viz-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 1.5rem;
            margin-bottom: 2rem;
        }

        .card {
            background-color: var(--surface-color);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 1.5rem;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06);
        }

        .card h2 {
            font-size: 1.125rem;
            margin-top: 0;
            margin-bottom: 1rem;
            color: var(--text-secondary);
            font-weight: 600;
        }

        .table-container {
            overflow-x: auto;
            margin-top: 2rem;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            text-align: left;
            color: var(--text-primary);
        }

        th, td {
            padding: 0.75rem 1rem;
            border-bottom: 1px solid var(--border-color);
        }

        th {
            color: var(--text-secondary);
            font-weight: 600;
            text-transform: uppercase;
            font-size: 0.75rem;
            letter-spacing: 0.05em;
        }

        tr:hover {
            background-color: rgba(255, 255, 255, 0.02);
        }

        @media (max-width: 768px) {
            .viz-grid {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>

<header>
    <h1>AuroraFit Performance Dashboard</h1>
    <div class="disclaimer">
        PROTOTYPE: This dashboard displays SIMULATED/PROJECTED estimates for planning purposes.
    </div>
</header>

<main>
    <div class="viz-grid">
        <div class="card">
            <h2>Monthly Visitors</h2>
            <canvas id="visitorsChart" aria-label="Line chart showing projected visitor growth over 6 months"></canvas>
        </div>
        <div class="card">
            <h2>Monthly Conversions</h2>
            <canvas id="conversionsChart" aria-label="Bar chart showing projected conversions over 6 months"></canvas>
        </div>
        <div class="card" style="grid-column: span 2;">
            <h2>Churn Rate Trend (%)</h2>
            <canvas id="churnChart" aria-label="Line chart showing projected churn rate decline over 6 months" height="100"></canvas>
        </div>
    </div>

    <div class="card">
        <h2>Projected Data Summary</h2>
        <div class="table-container">
            <table>
                <thead>
                    <tr>
                        <th>Month</th>
                        <th>Visitors</th>
                        <th>Conversions</th>
                        <th>Conv. Rate (%)</th>
                        <th>Churn Rate (%)</th>
                    </tr>
                </thead>
                <tbody id="dataTableBody">
                    <!-- Data injected by JS -->
                </tbody>
            </table>
        </div>
    </div>
</main>

<script>
    document.addEventListener('DOMContentLoaded', () => {
        const data = [
            { month: 'Month 1', visitors: 1567, conversions: 34, rate: 2.2, churn: 6.5 },
            { month: 'Month 2', visitors: 1739, conversions: 43, rate: 2.5, churn: 6.2 },
            { month: 'Month 3', visitors: 1896, conversions: 51, rate: 2.7, churn: 6.1 },
            { month: 'Month 4', visitors: 2124, conversions: 59, rate: 2.8, churn: 5.7 },
            { month: 'Month 5', visitors: 2336, conversions: 65, rate: 2.8, churn: 5.5 },
            { month: 'Month 6', visitors: 2523, conversions: 68, rate: 2.7, churn: 5.5 },
        ];

        const labels = data.map(d => d.month);
        const visitors = data.map(d => d.visitors);
        const conversions = data.map(d => d.conversions);
        const churn = data.map(d => d.churn);

        // Visitors Chart
        new Chart(document.getElementById('visitorsChart'), {
            type: 'line',
            data: {
                labels: labels,
                datasets: [{
                    label: 'Visitors',
                    data: visitors,
                    borderColor: '#14B8A6',
                    backgroundColor: 'rgba(20, 184, 166, 0.1)',
                    fill: true,
                    tension: 0.4,
                    pointBackgroundColor: '#14B8A6'
                }]
            },
            options: {
                responsive: true,
                plugins: { legend: { display: false } },
                scales: {
                    y: { grid: { color: '#334155' }, ticks: { color: '#94A3B8' } },
                    x: { grid: { display: false }, ticks: { color: '#94A3B8' } }
                }
            }
        });

        // Conversions Chart
        new Chart(document.getElementById('conversionsChart'), {
            type: 'bar',
            data: {
                labels: labels,
                datasets: [{
                    label: 'Conversions',
                    data: conversions,
                    backgroundColor: '#FB7185',
                    borderRadius: 5
                }]
            },
            options: {
                responsive: true,
                plugins: { legend: { display: false } },
                scales: {
                    y: { grid: { color: '#334155' }, ticks: { color: '#94A3B8' } },
                    x: { grid: { display: false }, ticks: { color: '#94A3B8' } }
                }
            }
        });

        // Churn Chart
        new Chart(document.getElementById('churnChart'), {
            type: 'line',
            data: {
                labels: labels,
                datasets: [{
                    label: 'Churn Rate (%)',
                    data: churn,
                    borderColor: '#14B8A6',
                    borderDash: [5, 5],
                    tension: 0.4,
                    pointBackgroundColor: '#14B8A6'
                }]
            },
            options: {
                responsive: true,
                plugins: { legend: { display: false } },
                scales: {
                    y: { grid: { color: '#334155' }, ticks: { color: '#94A3B8' } },
                    x: { grid: { display: false }, ticks: { color: '#94A3B8' } }
                }
            }
        });

        // Populate Table
        const tbody = document.getElementById('dataTableBody');
        data.forEach(row => {
            const tr = document.createElement('tr');
            tr.innerHTML = `
                <td>${row.month}</td>
                <td>${row.visitors.toLocaleString()}</td>
                <td>${row.conversions}</td>
                <td>${row.rate}%</td>
                <td>${row.churn}%</td>
            `;
            tbody.appendChild(tr);
        });
    });
</script>

</body>
</html>
