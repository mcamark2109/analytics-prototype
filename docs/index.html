<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AuroraFit Performance Dashboard</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        :root {
            --bg-color: #121212;
            --card-color: #1E1E1E;
            --primary-accent: #14B8A6;
            --secondary-accent: #FB7185;
            --text-primary: #F8FAFC;
            --text-secondary: #94A3B8;
            --border-color: #334155;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-primary);
            font-family: 'Inter', 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            padding: 0;
            line-height: 1.6;
        }

        header {
            padding: 2rem 1rem;
            text-align: center;
            border-bottom: 1px solid var(--border-color);
        }

        h1 {
            font-weight: 700;
            font-size: 2.5rem;
            margin: 0;
            letter-spacing: -0.025em;
        }

        .disclaimer {
            color: var(--text-secondary);
            font-size: 0.9rem;
            margin-top: 0.5rem;
            font-style: italic;
            opacity: 0.8;
        }

        main {
            max-width: 1200px;
            margin: 0 auto;
            padding: 2rem 1rem;
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(450px, 1fr));
            gap: 1.5rem;
            margin-bottom: 1.5rem;
        }

        .card {
            background-color: var(--card-color);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 1.5rem;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06);
        }

        .card h2 {
            font-size: 1.25rem;
            color: var(--text-primary);
            margin-bottom: 1rem;
            font-weight: 600;
        }

        .table-container {
            overflow-x: auto;
            width: 100%;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 1rem;
            color: var(--text-secondary);
        }

        th, td {
            padding: 0.75rem 1rem;
            text-align: left;
            border-bottom: 1px solid var(--border-color);
        }

        th {
            color: var(--text-primary);
            font-weight: 600;
            background-color: rgba(255, 255, 255, 0.02);
        }

        tr:last-child td {
            border-bottom: none;
        }

        @media (max-width: 600px) {
            .grid {
                grid-template-columns: 1fr;
            }
            h1 {
                font-size: 1.75rem;
            }
        }
    </style>
</head>
<body>

    <header>
        <h1>AuroraFit Performance Dashboard</h1>
        <div class="disclaimer">PROTOTYPE: This dashboard displays SIMULATED/PROJECTED estimates for planning purposes.</div>
    </header>

    <main>
        <div class="grid">
            <div class="card">
                <h2>Monthly Visitors</h2>
                <canvas id="visitorsChart" aria-label="Line chart showing visitor growth"></canvas>
            </div>
            <div class="card">
                <h2>Monthly Conversions</h2>
                <canvas id="conversionsChart" aria-label="Bar chart showing conversion growth"></canvas>
            </div>
            <div class="card">
                <h2>Churn Rate (%)</h2>
                <canvas id="churnChart" aria-label="Line chart showing churn rate decline"></canvas>
            </div>
            <div class="card">
                <h2>Data Summary</h2>
                <div class="table-container">
                    <table id="dataTable">
                        <thead>
                            <tr>
                                <th>Month</th>
                                <th>Visitors</th>
                                <th>Conversions</th>
                                <th>Conv. Rate (%)</th>
                                <th>Churn Rate (%)</th>
                            </tr>
                        </thead>
                        <tbody>
                            <!-- Data populated by JS -->
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </main>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const data = [
                { month: 'Month 1', visitors: 1567, conversions: 34, convRate: 2.2, churnRate: 6.5 },
                { month: 'Month 2', visitors: 1739, conversions: 43, convRate: 2.5, churnRate: 6.2 },
                { month: 'Month 3', visitors: 1896, conversions: 51, convRate: 2.7, churnRate: 6.1 },
                { month: 'Month 4', visitors: 2124, conversions: 59, convRate: 2.8, churnRate: 5.7 },
                { month: 'Month 5', visitors: 2336, conversions: 65, convRate: 2.8, churnRate: 5.5 },
                { month: 'Month 6', visitors: 2523, conversions: 68, convRate: 2.7, churnRate: 5.5 },
            ];

            const labels = data.map(d => d.month);

            // Table population
            const tbody = document.querySelector('#dataTable tbody');
            data.forEach(d => {
                const row = `<tr>
                    <td>${d.month}</td>
                    <td>${d.visitors.toLocaleString()}</td>
                    <td>${d.conversions}</td>
                    <td>${d.convRate}%</td>
                    <td>${d.churnRate}%</td>
                </tr>`;
                tbody.innerHTML += row;
            });

            // Visitors Chart
            new Chart(document.getElementById('visitorsChart'), {
                type: 'line',
                data: {
                    labels: labels,
                    datasets: [{
                        label: 'Visitors',
                        data: data.map(d => d.visitors),
                        borderColor: '#14B8A6',
                        backgroundColor: 'rgba(20, 184, 166, 0.2)',
                        fill: true,
                        tension: 0.4
                    }]
                },
                options: {
                    responsive: true,
                    plugins: { legend: { display: false } },
                    scales: {
                        y: { grid: { color: '#334155' }, ticks: { color: '#94A3B8' } },
                        x: { grid: { color: '#334155' }, ticks: { color: '#94A3B8' } }
                    }
                }
            });

            // Conversions Chart
            new Chart(document.getElementById('conversionsChart'), {
                type: 'bar',
                data: {
                    labels: labels,
                    datasets: [{
                        label: 'Conversions',
                        data: data.map(d => d.conversions),
                        backgroundColor: '#FB7185',
                        borderRadius: 5
                    }]
                },
                options: {
                    responsive: true,
                    plugins: { legend: { display: false } },
                    scales: {
                        y: { grid: { color: '#334155' }, ticks: { color: '#94A3B8' } },
                        x: { grid: { color: '#334155' }, ticks: { color: '#94A3B8' } }
                    }
                }
            });

            // Churn Chart
            new Chart(document.getElementById('churnChart'), {
                type: 'line',
                data: {
                    labels: labels,
                    datasets: [{
                        label: 'Churn Rate (%)',
                        data: data.map(d => d.churnRate),
                        borderColor: '#14B8A6',
                        borderDash: [5, 5],
                        tension: 0.1,
                        fill: false
                    }]
                },
                options: {
                    responsive: true,
                    plugins: { legend: { display: false } },
                    scales: {
                        y: { grid: { color: '#334155' }, ticks: { color: '#94A3B8' } },
                        x: { grid: { color: '#334155' }, ticks: { color: '#94A3B8' } }
                    }
                }
            });
        });
    </script>
</body>
</html>
