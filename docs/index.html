<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AuroraFit Performance Dashboard</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        :root {
            --bg-color: #121212;
            --surface-color: #1E1E1E;
            --primary-accent: #14B8A6;
            --secondary-accent: #FB7185;
            --text-primary: #F8FAFC;
            --text-secondary: #94A3B8;
            --border-color: #334155;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-primary);
            font-family: 'Inter', 'Segoe UI', system-ui, -apple-system, sans-serif;
            margin: 0;
            padding: 0;
            line-height: 1.6;
        }

        header {
            padding: 2rem 1rem;
            text-align: center;
            border-bottom: 1px solid var(--border-color);
        }

        h1 {
            font-weight: 700;
            font-size: 2rem;
            margin: 0 0 0.5rem 0;
            letter-spacing: -0.025em;
        }

        .disclaimer {
            color: var(--text-secondary);
            font-size: 0.9rem;
            max-width: 600px;
            margin: 0 auto;
            background: rgba(20, 184, 166, 0.1);
            padding: 0.5rem 1rem;
            border-radius: 8px;
            border: 1px solid var(--primary-accent);
            display: inline-block;
        }

        main {
            max-width: 1200px;
            margin: 2rem auto;
            padding: 0 1rem;
        }

        .viz-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(450px, 1fr));
            gap: 1.5rem;
            margin-bottom: 2rem;
        }

        .card {
            background-color: var(--surface-color);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 1.5rem;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.3);
        }

        .card h2 {
            font-size: 1.25rem;
            margin-top: 0;
            margin-bottom: 1rem;
            color: var(--text-primary);
            font-weight: 600;
        }

        .table-container {
            overflow-x: auto;
            background-color: var(--surface-color);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 1.5rem;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            text-align: left;
            color: var(--text-secondary);
        }

        th {
            color: var(--text-primary);
            font-weight: 600;
            border-bottom: 2px solid var(--border-color);
            padding: 1rem;
        }

        td {
            padding: 1rem;
            border-bottom: 1px solid var(--border-color);
        }

        tr:hover {
            background-color: rgba(255, 255, 255, 0.02);
        }

        @media (max-width: 600px) {
            .viz-grid {
                grid-template-columns: 1fr;
            }
            h1 {
                font-size: 1.5rem;
            }
        }
    </style>
</head>
<body>

    <header>
        <h1>AuroraFit Performance Dashboard</h1>
        <div class="disclaimer">
            <strong>PROTOTYPE:</strong> This dashboard displays SIMULATED/PROJECTED estimates for planning purposes.
        </div>
    </header>

    <main>
        <div class="viz-grid">
            <div class="card">
                <h2>Website Visitors</h2>
                <canvas id="visitorsChart" aria-label="Line chart showing projected website visitor growth"></canvas>
            </div>
            <div class="card">
                <h2>Total Conversions</h2>
                <canvas id="conversionsChart" aria-label="Bar chart showing projected conversion growth"></canvas>
            </div>
            <div class="card">
                <h2>Churn Rate (%)</h2>
                <canvas id="churnChart" aria-label="Line chart showing projected churn rate decline"></canvas>
            </div>
        </div>

        <div class="table-container">
            <h2>Projected Data Summary</h2>
            <table>
                <thead>
                    <tr>
                        <th>Month</th>
                        <th>Visitors</th>
                        <th>Conversions</th>
                        <th>Conv. Rate (%)</th>
                        <th>Churn Rate (%)</th>
                    </tr>
                </thead>
                <tbody id="dataTable">
                    <!-- Data populated by JS -->
                </tbody>
            </table>
        </div>
    </main>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const data = {
                labels: ['Month 1', 'Month 2', 'Month 3', 'Month 4', 'Month 5', 'Month 6'],
                visitors: [1567, 1739, 1896, 2124, 2336, 2523],
                conversions: [34, 43, 51, 59, 65, 68],
                convRate: [2.2, 2.5, 2.7, 2.8, 2.8, 2.7],
                churnRate: [6.5, 6.2, 6.1, 5.7, 5.5, 5.5]
            };

            // Populate Table
            const tableBody = document.getElementById('dataTable');
            data.labels.forEach((month, i) => {
                const row = `<tr>
                    <td>${month}</td>
                    <td>${data.visitors[i].toLocaleString()}</td>
                    <td>${data.conversions[i]}</td>
                    <td>${data.convRate[i]}%</td>
                    <td>${data.churnRate[i]}%</td>
                </tr>`;
                tableBody.innerHTML += row;
            });

            // Common Chart Configs
            Chart.defaults.color = '#94A3B8';
            Chart.defaults.borderColor = '#334155';

            // Visitors Chart
            new Chart(document.getElementById('visitorsChart'), {
                type: 'line',
                data: {
                    labels: data.labels,
                    datasets: [{
                        label: 'Visitors',
                        data: data.visitors,
                        borderColor: '#14B8A6',
                        backgroundColor: 'rgba(20, 184, 166, 0.2)',
                        fill: true,
                        tension: 0.4
                    }]
                },
                options: {
                    responsive: true,
                    plugins: { legend: { display: false } },
                    scales: { y: { beginAtZero: false } }
                }
            });

            // Conversions Chart
            new Chart(document.getElementById('conversionsChart'), {
                type: 'bar',
                data: {
                    labels: data.labels,
                    datasets: [{
                        label: 'Conversions',
                        data: data.conversions,
                        backgroundColor: '#FB7185',
                        borderRadius: 5
                    }]
                },
                options: {
                    responsive: true,
                    plugins: { legend: { display: false } }
                }
            });

            // Churn Chart
            new Chart(document.getElementById('churnChart'), {
                type: 'line',
                data: {
                    labels: data.labels,
                    datasets: [{
                        label: 'Churn Rate (%)',
                        data: data.churnRate,
                        borderColor: '#14B8A6',
                        borderDash: [5, 5],
                        tension: 0.4,
                        fill: false
                    }]
                },
                options: {
                    responsive: true,
                    plugins: { legend: { display: false } },
                    scales: { y: { beginAtZero: false } }
                }
            });
        });
    </script>
</body>
</html>
